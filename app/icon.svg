<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007a60" />
      <stop offset="50%" stop-color="#006a53" />
      <stop offset="100%" stop-color="#004737" />
    </linearGradient>

    <!-- Highlight Rim Gradient -->
    <linearGradient id="cy-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Clipboard Board Gradient -->
    <linearGradient id="cy-board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7f4" />
    </linearGradient>

    <!-- Clip Clasp Gradient -->
    <linearGradient id="cy-clip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8f9dc" />
      <stop offset="100%" stop-color="#70d6b6" />
    </linearGradient>

    <!-- Diamond Emblem Gradient -->
    <linearGradient id="cy-emblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007a60" />
      <stop offset="100%" stop-color="#00513f" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cy-shadow-board" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#002118" flood-opacity="0.35" />
    </filter>
    <filter id="cy-shadow-clip" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#002118" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#cy-bg)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="114" fill="none" stroke="url(#cy-rim)" stroke-width="6" />

  <!-- Clipboard Board -->
  <g filter="url(#cy-shadow-board)">
    <!-- Board Base (White Card) -->
    <rect x="96" y="96" width="320" height="340" rx="44" fill="url(#cy-board)" />
    <rect x="96" y="96" width="320" height="340" rx="44" fill="none" stroke="#d5e8e0" stroke-width="3" />
  </g>

  <!-- Clipboard Content -->
  <!-- Top Center Clip / Clasp -->
  <g filter="url(#cy-shadow-clip)">
    <!-- Clip Base Plate -->
    <rect x="186" y="64" width="140" height="60" rx="20" fill="url(#cy-clip)" />
    <!-- Clip Inner Ring / Hole -->
    <rect x="226" y="78" width="60" height="20" rx="10" fill="#004737" opacity="0.85" />
  </g>

  <!-- Central Diamond Emblem ◈ -->
  <!-- Outer Diamond -->
  <polygon points="256,168 336,248 256,328 176,248" fill="url(#cy-emblem)" />
  
  <!-- Inner Diamond Cutout / Inset -->
  <polygon points="256,198 306,248 256,298 206,248" fill="#ffffff" />
  
  <!-- Center Core Diamond -->
  <polygon points="256,224 280,248 256,272 232,248" fill="#16856a" />

  <!-- Real-Time Transfer / Text Lines -->
  <!-- Line 1 -->
  <rect x="156" y="356" width="200" height="18" rx="9" fill="#006a53" opacity="0.85" />
  <!-- Line 2 -->
  <rect x="190" y="388" width="132" height="14" rx="7" fill="#78d8b9" opacity="0.9" />

  <!-- Dynamic Spark / Signal Dot -->
  <circle cx="366" cy="144" r="10" fill="#a8f9dc" />
</svg>